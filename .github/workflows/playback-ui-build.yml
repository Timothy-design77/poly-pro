name: Playback UI Build

on:
  push:
    branches:
      - agent/playback-workbench
    paths:
      - .github/workflows/playback-ui-build.yml

permissions:
  contents: write

jobs:
  build-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/playback-workbench
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build playback workbench
        run: python3 scripts/playback_ui_build.py

      - name: Verify playback workbench
        run: |
          npm ci
          npm run typecheck
          npm run test:run
          npm run build
          npm audit --audit-level=high

      - name: Commit verified playback workbench
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Build transport-first playback workbench"
          git push origin HEAD:agent/playback-workbench
