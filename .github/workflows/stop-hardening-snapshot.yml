name: Stop Hardening Snapshot

on:
  push:
    branches:
      - agent/production-hardening-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stop-hardening-snapshot
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary snapshot automation
        run: |
          rm -f .github/workflows/snapshot-hardening-v2.yml
          rm -f .github/workflows/stop-hardening-snapshot.yml
          rm -rf diagnostics/branch-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary hardening snapshot diagnostics'
            git push origin HEAD:agent/production-hardening-v2
          fi
