name: Final Remediation Cleanup

on:
  push:
    branches: [agent/full-stack-remediation-2026-09-15]
    paths: [.github/workflows/final-remediation-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/full-stack-remediation-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply final edge-case and test corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/hooks/useRecording.ts')
          s = p.read_text()
          needle = """    const sessionId = generateSessionId();\n    sessionIdRef.current = sessionId;"""
          replacement = """    const sessionId = generateSessionId();\n    sessionIdRef.current = sessionId;\n    // Snapshot transport state before any microphone permission request can fail.\n    // A denied mic must not stop a metronome the user already had running.\n    metronomeWasRunningRef.current = audioEngine.running;"""
          if needle not in s:
            raise SystemExit('recording start-state target not found')
          s = s.replace(needle, replacement, 1)
          s = s.replace("      metronomeWasRunningRef.current = audioEngine.running;\n      const autoStartMetronome", "      const autoStartMetronome", 1)
          p.write_text(s)

          p = Path('e2e/app.spec.ts')
          s = p.read_text()
          old = """  await page.getByRole('button', { name: 'Projects' }).click();\n  await expect(page.getByRole('heading', { name: 'Projects' })).toBeVisible();"""
          new = """  const projectsNav = page.getByRole('button', { name: 'Projects' });\n  await projectsNav.click();\n  await expect(projectsNav).toHaveAttribute('aria-current', 'page');\n  await expect(page.getByText('Tap a project to make it active. Use Edit for project settings.')).toBeVisible();"""
          if old not in s:
            raise SystemExit('navigation test target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Record remediation status
        run: |
          cat > docs/REMEDIATION-2026-09-15.md <<'EOF'
          # Poly Pro — Full-stack remediation (2026-09-15)

          This pass addresses the end-to-end audit performed against production `main` after the frozen audio/analysis scope shipped.

          ## Corrected

          - IndexedDB recovery no longer deletes user data automatically.
          - Recording audio is persisted incrementally in durable chunks instead of retaining a full 30-minute Float32 session in React memory.
          - Interrupted recordings with completed durable chunks are recoverable on the next launch.
          - Real recording sample rate is preserved through playback and analysis.
          - Microphone/worklet capture is prepared before an auto-started metronome begins.
          - Recording startup/flush/save use explicit lifecycle phases and actionable failures.
          - PWA updates download normally but cannot activate/reload during recording, analysis, calibration, backup/import, or destructive data operations.
          - Timeline and Review load raw PCM correctly and use limiter-protected bounded gain.
          - Click overlays and WAV-with-click export prefer the persisted beat grid instead of reconstructing beat zero at recording start.
          - Manual hit corrections are re-scored and persisted coherently with session metrics.
          - Full analysis runs in a Web Worker and supports hard cancellation.
          - Detection-only controls are no longer presented as instant re-score controls.
          - Noise-floor estimation no longer assumes the first 500 ms is silence and uses the same filtered/gained signal as onset detection.
          - Project deletion preserves its sessions by moving them to Quick Start.
          - Backup/import operations are bounded; data-only backup is available; Delete All clears every Poly Pro store without deleting the database schema.
          - Unsupported browser-direct cloud separation is disabled until a secure server-side integration exists.
          - Dialog, keypad, session-tab, focus, and progress semantics were hardened for keyboard/accessibility use.
          - Build tooling was refreshed and the dependency audit is clean.
          - CI now includes Chromium smoke tests for navigation/keypad, fake-microphone recording durability, and offline PWA reload.

          ## Verification policy

          Automated verification does not replace the real-device acceptance ledger. Audio feel, physical microphone routing, Bluetooth behavior, subjective click quality, real Fold layout/ergonomics, and long-session thermal/performance behavior remain manual device checks until explicitly exercised on the target phone.
          EOF

          cat >> docs/MANUAL-TEST-LEDGER.md <<'EOF'

          ## I. Reliability hardening — 2026-09-15 remediation

          - TODO — Denying/revoking microphone permission while the metronome is already running leaves the existing metronome session undisturbed.
          - TODO — Interrupting/killing the PWA during a recording and reopening recovers completed durable audio chunks without deleting existing data.
          - TODO — A newly deployed PWA version waits to reload until active recording/analysis/calibration/data work is complete.
          - TODO — A 15–30 minute recording completes, saves, reopens, and plays on the Fold without browser termination or unacceptable thermal/memory behavior.
          - TODO — Timeline and immediate Review playback are clean at low/default/high volume with no new clipping or limiter pumping.
          - TODO — Manual hit correction followed by Save Corrections persists the corrected markers and updated score after closing/reopening Session Detail.
          - TODO — Full backup and data-only backup both restore expected metadata; full backup restores recording audio when within safe size limits.
          - TODO — Project deletion moves historical sessions to Quick Start rather than hiding/deleting them.
          - TODO — Offline launch still works after the upgraded Vite/PWA toolchain and service-worker lifecycle changes.
          EOF

      - name: Remove temporary remediation workflows
        run: |
          rm -f .github/workflows/remediation-bot.yml \
                .github/workflows/remediation-bot-2.yml \
                .github/workflows/remediation-bot-3.yml \
                .github/workflows/final-remediation-cleanup.yml

      - name: Verify cleanup tree before push
        run: |
          npm ci
          npm run typecheck
          npm run test:run
          npm run build
          npm audit --audit-level=high

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize reliability remediation and verification plan"
          git push origin HEAD:agent/full-stack-remediation-2026-09-15
