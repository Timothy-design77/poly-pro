name: Export Upgraded Dependency Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/architecture-hardening

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve upgraded dependency graph
        run: npm install --package-lock-only
      - name: Install upgraded dependencies
        run: npm ci
      - name: Archive lockfile and installed dependencies
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.json
          tar -czf /tmp/poly-pro-upgraded-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: poly-pro-upgraded-dependencies-${{ github.sha }}
          path: |
            /tmp/package-lock.json
            /tmp/poly-pro-upgraded-node-modules.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
