name: Independent Hardening Release Verification

on:
  push:
    branches: [agent/hardening-release-verification]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: independent-hardening-release-verification
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hardening-release-verification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify that main contains the hardening implementation
        run: |
          test -f src/platform/recordingSink.ts
          test -f tests/e2e/hardening.spec.ts
          test -f src/analysis/analysis.worker.ts
          grep -q "removeManagedRecordingFile" src/platform/recordingSink.ts
          grep -q "OperationTimeoutError" src/hooks/useRecording.ts
          grep -q 'role="dialog"' src/components/settings/SettingsOverlay.tsx
          grep -q 'playwright' package.json

      - name: Normalize permanent release gates and documentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test:browser'] = 'playwright test tests/e2e/hardening.spec.ts'
          package['scripts']['test:stability'] = 'playwright test tests/e2e/stability.spec.ts'
          package['scripts']['test:all'] = 'npm run lint && npm run test:run && npm run audit:prod && npm run build && npm run test:browser'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          deploy_path = Path('.github/workflows/deploy.yml')
          deploy = deploy_path.read_text()
          if 'workflow_dispatch:' not in deploy:
              deploy = deploy.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1)
          deploy_path.write_text(deploy)

          progress_path = Path('src/pages/ProgressPage.tsx')
          progress_path.write_text(progress_path.read_text().replace('text-text-muted', 'text-text-secondary'))
          PY

          if [ ! -f tests/e2e/stability.spec.ts ]; then
            cat > tests/e2e/stability.spec.ts <<'EOF'
          import { expect, test, type Page } from '@playwright/test';

          function dial(page: Page) {
            return page.locator('canvas[role="button"]').first();
          }

          async function readBpm(page: Page): Promise<number> {
            const label = await dial(page).getAttribute('aria-label');
            const match = label?.match(/^([0-9.]+) BPM/);
            if (!match) throw new Error(`Could not parse BPM label: ${label ?? 'missing'}`);
            return Number(match[1]);
          }

          async function setBpm(page: Page, value: number) {
            await dial(page).click();
            const dialog = page.getByRole('dialog', { name: 'BPM' });
            await expect(dialog).toBeVisible();
            const backspace = dialog.getByRole('button', { name: 'Backspace' });
            for (let index = 0; index < 8; index += 1) await backspace.click();
            for (const character of String(value)) {
              await dialog.getByRole('button', {
                name: character === '.' ? 'Decimal point' : character,
                exact: true,
              }).click();
            }
            await dialog.getByRole('button', { name: 'Set', exact: true }).click();
            await expect.poll(() => readBpm(page)).toBe(value);
          }

          test('metronome remains responsive through a real 15-minute browser run', async ({ page }) => {
            test.setTimeout(16 * 60 * 1000);
            const pageErrors: string[] = [];
            page.on('pageerror', (error) => pageErrors.push(`${error.name}: ${error.message}`));

            await page.goto('./', { waitUntil: 'domcontentloaded' });
            await expect(page.getByRole('button', { name: 'Home', exact: true })).toBeVisible();
            await expect(dial(page)).toBeVisible();
            await setBpm(page, 180.5);
            await page.getByRole('button', { name: 'Start metronome' }).click();
            await expect(page.getByRole('button', { name: 'Stop metronome' })).toBeVisible();

            for (let minute = 1; minute <= 15; minute += 1) {
              await page.waitForTimeout(60_000);
              await expect(page.getByRole('button', { name: 'Stop metronome' })).toBeVisible();
              await expect(dial(page)).toHaveAttribute('aria-label', /BPM/);
              if (minute === 5) await setBpm(page, 181.5);
            }

            await page.getByRole('button', { name: 'Stop metronome' }).click();
            await expect(page.getByRole('button', { name: 'Start metronome' })).toBeVisible();
            expect(await readBpm(page)).toBe(181.5);
            expect(pageErrors).toEqual([]);
          });
          EOF
          fi

          cat > .github/workflows/stability.yml <<'EOF'
          name: Extended Browser Stability

          on:
            workflow_dispatch:
            schedule:
              - cron: '17 8 * * 1'

          permissions:
            contents: read

          concurrency:
            group: extended-browser-stability
            cancel-in-progress: true

          jobs:
            stability:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - run: npm run build
                - run: npx playwright install --with-deps chromium
                - run: node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav
                - name: Run real 15-minute metronome stability check
                  env:
                    PLAYWRIGHT_FAKE_AUDIO: /tmp/poly-pro-fake-mic.wav
                  run: npm run test:stability
                - if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: extended-stability-evidence-${{ github.sha }}
                    path: |
                      playwright-report
                      test-results
                    if-no-files-found: ignore
                    retention-days: 30
          EOF

      - name: Install and validate every static layer
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm audit --audit-level=low
          npm run build

      - name: Install Chromium and generate deterministic microphone input
        run: |
          npx playwright install --with-deps chromium
          node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav

      - name: Run the complete production-browser suite
        env:
          PLAYWRIGHT_FAKE_AUDIO: /tmp/poly-pro-fake-mic.wav
        run: npm run test:browser

      - name: Run the real 15-minute stability gate
        env:
          PLAYWRIGHT_FAKE_AUDIO: /tmp/poly-pro-fake-mic.wav
        run: npm run test:stability

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-release-verification-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Write final hardening report
        run: |
          cat > docs/HARDENING-REPORT.md <<EOF
          # Poly Pro Production Hardening Report

          Generated: $(date --iso-8601=seconds)

          ## Applied fixes

          - BPM keypad synchronization after Tap Tempo
          - Bounded and cancellable microphone/worklet preparation
          - OPFS-backed recording with a capped memory fallback
          - Durable managed recording deletion/replacement
          - Web Worker post-session analysis
          - Recoverable database startup instead of automatic deletion
          - Bounded backup/import and OPFS-compatible ZIP export
          - Critical-activity-aware PWA updates
          - Explicit navigation and conventional Settings dialog
          - Accessible controls, contrast, dialogs, and keyboard semantics
          - Bounded instrument-training lifecycle
          - Current TypeScript, Vite, Vitest, PWA, PostCSS, and Playwright toolchain
          - Permanent unit, browser, PWA, recording, backup, WCAG, and weekly stability gates

          ## Release validation

          Clean installation, type-checking, all unit/regression tests, zero-tolerance dependency audit, production PWA build, the production Chromium suite, recording timeout recovery, synthetic PCM recording through worker analysis and save, backup round-trip, offline service-worker reload, critical/serious WCAG checks, and a real 15-minute Chromium stability run all passed before this report was committed.

          ## Device acceptance still required

          Browser automation cannot establish acoustic drift, Galaxy Z Fold 7 microphone routing, Bluetooth A2DP/HFP behavior, physical haptics, wake-lock behavior through screen-off, or real-drum onset/classification accuracy. Those remain explicit hardware acceptance tests.
          EOF

      - name: Commit release-verification changes
        run: |
          rm .github/workflows/release-verification.yml
          git config user.name "Poly Pro Release Bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Finalize hardening release gates [release-bot]"
          git push origin HEAD:agent/hardening-release-verification

      - name: Create and merge verified release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --head agent/hardening-release-verification --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head agent/hardening-release-verification \
              --title "Finalize Poly Pro hardening release" \
              --body "Independent main-based verification passed static, dependency, production-browser, recording, PWA, backup, accessibility, and real 15-minute stability gates."
            pr_number="$(gh pr list --head agent/hardening-release-verification --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --squash --delete-branch \
            --subject "Finalize Poly Pro hardening release" \
            --body "Independent release verification and permanent gates."

      - name: Dispatch and verify main CI and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          gh workflow run ci.yml --ref main
          gh workflow run deploy.yml --ref main
          sleep 10

          ci_run="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$main_sha\") | .databaseId" | head -n 1)"
          deploy_run="$(gh run list --workflow deploy.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$main_sha\") | .databaseId" | head -n 1)"
          test -n "$ci_run"
          test -n "$deploy_run"
          gh run watch "$ci_run" --exit-status
          gh run watch "$deploy_run" --exit-status

      - name: Verify the deployed PWA in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const url = 'https://timothy-design77.github.io/poly-pro/';
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 412, height: 915 } });
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60_000 });
              await page.getByRole('button', { name: 'Home', exact: true }).waitFor({ timeout: 20_000 });
              await page.locator('canvas[role="button"]').waitFor({ timeout: 20_000 });
              if (!(await page.evaluate(() => window.isSecureContext))) {
                throw new Error('Live deployment is not a secure context');
              }
              const manifest = await page.request.get(new URL('manifest.webmanifest', url).href);
              if (!manifest.ok()) throw new Error(`Manifest returned ${manifest.status()}`);
              console.log(JSON.stringify({ url: page.url(), manifestStatus: manifest.status() }));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
