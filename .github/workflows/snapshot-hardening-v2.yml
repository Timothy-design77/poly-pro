name: Snapshot Hardening v2

on:
  push:
    branches:
      - agent/production-hardening-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-hardening-v2
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact branch snapshot
        shell: bash
        run: |
          rm -rf diagnostics/branch-snapshot
          mkdir -p diagnostics/branch-snapshot
          git archive --format=zip --output=diagnostics/branch-snapshot/hardening-v2.zip HEAD \
            ':(exclude)diagnostics/branch-snapshot/hardening-v2.zip'

      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/branch-snapshot/hardening-v2.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Capture hardening branch diagnostic snapshot'
            git push origin HEAD:agent/production-hardening-v2
          fi
