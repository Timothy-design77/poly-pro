name: Export Dependency Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/architecture-hardening

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive installed dependencies
        run: tar -czf /tmp/poly-pro-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: poly-pro-node-modules-${{ github.sha }}
          path: /tmp/poly-pro-node-modules.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
