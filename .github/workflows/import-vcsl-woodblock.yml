name: Import VCSL woodblock (one-shot)

on:
  push:
    branches:
      - agent/real-woodblock-sample
    paths:
      - .github/workflows/import-vcsl-woodblock.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audio branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-woodblock-sample
          fetch-depth: 0

      - name: Import verified VCSL recording
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://raw.githubusercontent.com/sgossner/VCSL/master/Idiophones/Struck%20Idiophones/Woodblock/wood_click_mp.wav'
          EXPECTED_BLOB='f625cb9b072b8a88ad588f8c125654f31e8c36cb'
          TARGET='public/sounds/woodblock.wav'

          mkdir -p "$(dirname "$TARGET")"
          curl --fail --location --retry 3 --retry-delay 1 "$SOURCE" --output "$TARGET"

          ACTUAL_BLOB="$(git hash-object "$TARGET")"
          echo "Expected upstream blob: $EXPECTED_BLOB"
          echo "Downloaded blob:        $ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          # This workflow is deliberately ephemeral. The generated commit keeps
          # only the verified bundled WAV and removes the importer itself.
          rm .github/workflows/import-vcsl-woodblock.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET" .github/workflows/import-vcsl-woodblock.yml
          git commit -m 'Replace default woodblock with real VCSL recording'
          git push origin HEAD:agent/real-woodblock-sample
