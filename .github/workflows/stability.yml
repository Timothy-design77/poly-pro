name: Extended Browser Stability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: extended-browser-stability
  cancel-in-progress: true

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production PWA
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate deterministic microphone fixture
        run: node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav

      - name: Run real 15-minute metronome stability check
        env:
          PLAYWRIGHT_FAKE_AUDIO: /tmp/poly-pro-fake-mic.wav
        run: npm run test:stability

      - name: Upload stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-stability-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
