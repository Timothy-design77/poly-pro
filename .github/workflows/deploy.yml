name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run unit and regression tests
        run: npm run test:run

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate deterministic microphone input
        run: node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav

      - name: Run production browser, PWA, recording, and accessibility tests
        env:
          PLAYWRIGHT_FAKE_AUDIO: /tmp/poly-pro-fake-mic.wav
        run: npm run test:browser

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
