name: Recording Startup Trace

on:
  workflow_dispatch:
  push:
    branches:
      - agent/full-functional-audit

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p audit-recording-trace
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav | tee audit-recording-trace/fake-audio.json
      - name: Start preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > audit-recording-trace/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/poly-pro/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Trace recording startup
        run: |
          AUDIT_BASE_URL=http://127.0.0.1:4173/poly-pro/ \
          AUDIT_FAKE_AUDIO=/tmp/poly-pro-fake-mic.wav \
          AUDIT_OUTPUT_DIR=audit-recording-trace \
          node tests/browser-recording-trace.mjs 2>&1 | tee audit-recording-trace/recording-trace.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poly-pro-recording-startup-trace-${{ github.sha }}
          path: audit-recording-trace
          if-no-files-found: error
          retention-days: 30
