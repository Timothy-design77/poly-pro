name: Remediation Bot 2

on:
  push:
    branches: [agent/full-stack-remediation-2026-09-15]
    paths: [.github/workflows/remediation-bot-2.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/full-stack-remediation-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply remaining deterministic code corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/hooks/useRecording.ts')
          s = p.read_text()
          s = s.replace("import { useProjectStore } from '../store/project-store';\n", "import { useProjectStore } from '../store/project-store';\nimport { useSettingsStore } from '../store/settings-store';\n")
          s = s.replace("const recordingConfigRef = useRef({ bpm: 120, meterNumerator: 4, meterDenominator: 4, subdivision: 1 });", "const recordingConfigRef = useRef({ bpm: 120, meterNumerator: 4, meterDenominator: 4, subdivision: 1, countInBars: 0 });")
          s = s.replace("        subdivision: metronome.subdivision,\n      };\n      metronomeWasRunningRef.current = audioEngine.running;", "        subdivision: metronome.subdivision,\n        countInBars: metronome.countInBars,\n      };\n      metronomeWasRunningRef.current = audioEngine.running;\n      const autoStartMetronome = !audioEngine.running && useSettingsStore.getState().includeClickInRecording;")
          s = s.replace("      if (!audioEngine.running) {\n        const started = audioEngine.startSync();", "      if (autoStartMetronome) {\n        const started = audioEngine.startSync();")
          old = """      const scheduledBeats = audioEngine.scheduledBeats.filter(\n        (beat) => beat.time >= recordingStartTime - 0.01 && beat.time <= recordingEndTime + 0.11,\n      );"""
          new = """      const capturedScheduledBeats = audioEngine.scheduledBeats.filter(\n        (beat) => beat.time >= recordingStartTime - 0.01 && beat.time <= recordingEndTime + 0.11,\n      );\n      let scheduledBeats = capturedScheduledBeats;\n      if (!metronomeWasRunningRef.current && recordingConfigRef.current.countInBars > 0) {\n        let remaining = recordingConfigRef.current.countInBars\n          * recordingConfigRef.current.meterNumerator\n          * recordingConfigRef.current.subdivision;\n        scheduledBeats = capturedScheduledBeats.filter((beat) => {\n          if (beat.trackId === 'track-0' && remaining > 0) { remaining--; return false; }\n          return true;\n        });\n      }"""
          if old not in s: raise SystemExit('recording scheduled-beat patch target not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/analysis/onset-detection.ts')
          s = p.read_text()
          start = s.index('export function estimateNoiseFloor(')
          end = s.index('// ─── Stage 2: Auto-Latency Detection', start)
          replacement = '''export function estimateNoiseFloor(\n  pcm: Float32Array,\n  sampleRate: number,\n  multiplier: number = 5,\n): number {\n  const windowSize = Math.max(128, Math.floor(sampleRate * 0.02));\n  const maxSamples = Math.min(pcm.length, Math.floor(sampleRate * 8));\n  if (maxSamples < windowSize) return 0.01;\n  const rmsWindows: number[] = [];\n  for (let start = 0; start + windowSize <= maxSamples; start += windowSize) {\n    let sumSq = 0;\n    for (let i = start; i < start + windowSize; i++) sumSq += pcm[i] * pcm[i];\n    rmsWindows.push(Math.sqrt(sumSq / windowSize));\n  }\n  rmsWindows.sort((a, b) => a - b);\n  const index = Math.min(rmsWindows.length - 1, Math.floor(rmsWindows.length * 0.2));\n  return Math.max((rmsWindows[index] ?? 0) * multiplier, 0.003);\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          old = '''  // Stage 1: Noise floor estimation\n  onProgress?.({ stage: 'noise-floor', progress: 0 });\n  const noiseFloor = estimateNoiseFloor(pcm, sampleRate, config.noiseFloorMultiplier);\n  const effectiveNoiseGate = Math.max(noiseFloor, config.noiseGate);\n  onProgress?.({ stage: 'noise-floor', progress: 1 });\n  await yieldToMain();\n\n  // Stage 2: Auto-latency\n  onProgress?.({ stage: 'latency-detect', progress: 0 });\n  const autoLatencyMs = detectAutoLatency(pcm, sampleRate);\n  onProgress?.({ stage: 'latency-detect', progress: 1 });\n  await yieldToMain();\n\n  // Apply high-pass filter if configured\n  let processedPcm = pcm;\n  if (config.highPassHz > 0) {\n    processedPcm = applyHighPass(pcm, sampleRate, config.highPassHz);\n  }'''
          new = '''  let processedPcm = pcm;\n  if (config.inputGain !== 1) {\n    processedPcm = new Float32Array(pcm.length);\n    for (let i = 0; i < pcm.length; i++) processedPcm[i] = pcm[i] * config.inputGain;\n  }\n  if (config.highPassHz > 0) processedPcm = applyHighPass(processedPcm, sampleRate, config.highPassHz);\n\n  onProgress?.({ stage: 'noise-floor', progress: 0 });\n  const noiseFloor = estimateNoiseFloor(processedPcm, sampleRate, config.noiseFloorMultiplier);\n  const effectiveNoiseGate = Math.max(noiseFloor, config.noiseGate);\n  onProgress?.({ stage: 'noise-floor', progress: 1 });\n  await yieldToMain();\n\n  onProgress?.({ stage: 'latency-detect', progress: 0 });\n  const autoLatencyMs = 0;\n  onProgress?.({ stage: 'latency-detect', progress: 1 });\n  await yieldToMain();'''
          if old not in s: raise SystemExit('onset pipeline patch target not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/analysis/types.ts')
          p.write_text(p.read_text().replace("'latency-detect': 'Detecting latency…'", "'latency-detect': 'Applying latency calibration…'"))
          PY

      - name: Upgrade stable toolchain
        run: |
          npm install --save-dev \
            vite@7.3.6 \
            @vitejs/plugin-react@5.2.0 \
            vite-plugin-pwa@1.3.0 \
            vitest@4.1.11 \
            typescript@6.0.3 \
            @playwright/test@1.63.0
          npm pkg set scripts.typecheck="tsc --noEmit" scripts.test:e2e="playwright test"
          npm audit fix

      - name: Verify transformed tree
        run: |
          npm run typecheck
          npm run test:run
          npm run build
          npm audit --audit-level=high

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json package-lock.json
          git commit -m "Finish DSP corrections and refresh toolchain"
          git push origin HEAD:agent/full-stack-remediation-2026-09-15
