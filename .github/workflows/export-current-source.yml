name: Export Current Source

on:
  workflow_dispatch:
  push:
    branches:
      - agent/architecture-hardening-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source snapshot
        shell: bash
        run: |
          rm -rf .git node_modules dist test-results playwright-report
          tar -czf /tmp/poly-pro-current-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: poly-pro-current-source-${{ github.sha }}
          path: /tmp/poly-pro-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
