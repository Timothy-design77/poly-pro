name: Apply Preserved Production Hardening

on:
  push:
    branches:
      - agent/harden-production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-preserved-production-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/harden-production'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Detect staged payload
        id: payload
        shell: bash
        run: |
          if [ ! -d .hardening ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if compgen -G '.hardening/final.*' >/dev/null; then
            echo 'stem=final' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif compgen -G '.hardening/harden.patch.b64.*' >/dev/null; then
            echo 'stem=harden.patch.b64' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No recognized staged payload was found.' >&2
            exit 1
          fi

      - name: Decode and verify payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          stem='${{ steps.payload.outputs.stem }}'
          mapfile -t chunks < <(find .hardening -maxdepth 1 -type f -name "$stem.*" -print | sort -V)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" > /tmp/hardening.patch.b64
          base64 --decode /tmp/hardening.patch.b64 > /tmp/hardening.patch.gz
          gzip --test /tmp/hardening.patch.gz
          gzip --decompress --stdout /tmp/hardening.patch.gz > /tmp/hardening.patch
          test -s /tmp/hardening.patch
          git apply --check /tmp/hardening.patch
          git apply --stat /tmp/hardening.patch

      - name: Apply payload and remove staging infrastructure
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git apply /tmp/hardening.patch
          rm -rf .hardening
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/workflows/apply-staged-hardening.yml
          git diff --check

      - name: Install and validate transformed source
        if: steps.payload.outputs.present == 'true'
        run: |
          npm ci
          npm run lint
          npm run test:run -- --reporter=verbose
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit validated source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply production hardening implementation'
          git push origin HEAD:agent/harden-production
