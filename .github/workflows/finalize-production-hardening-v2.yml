name: Finalize Production Hardening v2

on:
  push:
    branches:
      - agent/production-hardening-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-production-hardening-v2
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify transformed source is complete
        shell: bash
        run: |
          test -f src/utils/with-timeout.ts
          test -f src/storage/recording-writer.ts
          test -f src/analysis/analysis-runner.ts
          test -f src/workers/analysis.worker.ts
          test -f tests/e2e/app.spec.ts
          test -f .github/workflows/browser.yml
          test ! -f scripts/apply-production-hardening.py
          test ! -f .github/workflows/apply-production-hardening-v2.yml
          test ! -d .hardening
          ! grep -R "indexedDB.deleteDatabase" src/store/db.ts
          grep -R "AudioWorklet initialization timed out" src/hooks/useRecording.ts
          grep -R "suppressLiveChangeRef" src/components/ui/NumberInput.tsx

      - name: Upgrade vulnerable build and test tooling
        run: |
          npm install --save-dev \
            vite@^7.1.3 \
            vitest@^3.2.4 \
            @vitejs/plugin-react@^4.7.0 \
            vite-plugin-pwa@^1.0.3 \
            typescript@^5.8.3 \
            postcss@^8.5.6 \
            autoprefixer@^10.4.21

      - name: Type-check
        run: npm run lint

      - name: Unit and regression tests
        run: npm run test:run -- --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Full dependency security audit
        run: npm audit --audit-level=low

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, PWA, offline, tempo, and accessibility tests
        run: npm run test:browser

      - name: Prepare clean source branch commit
        shell: bash
        run: |
          rm -f .github/workflows/finalize-production-hardening-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finish production hardening and toolchain upgrades'
            git push origin HEAD:agent/production-hardening-v2
          fi

      - name: Squash validated hardening onto current main
        shell: bash
        run: |
          HARDENING_SHA=$(git rev-parse HEAD)
          git fetch origin main
          git checkout -B production-hardening-release origin/main
          git merge --squash "$HARDENING_SHA"
          git commit -m 'Harden recording, storage, accessibility, and browser validation'
          git push origin HEAD:main

      - name: Record release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          git status --short > release-evidence/git-status.txt || true
          git log -5 --oneline > release-evidence/recent-commits.txt || true
          npm audit --json > release-evidence/npm-audit.json || true
          npm ls --depth=0 --json > release-evidence/dependencies.json || true
          cp -r test-results release-evidence/test-results 2>/dev/null || true
          cp -r playwright-report release-evidence/playwright-report 2>/dev/null || true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-v2-release-${{ github.sha }}
          path: release-evidence
          if-no-files-found: warn
          retention-days: 30
