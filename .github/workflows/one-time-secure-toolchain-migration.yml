name: One-time Secure Toolchain Migration

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix typed backup buffers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/utils/backup.ts';
          let source = fs.readFileSync(file, 'utf8');
          const pairs = [
            ["blob: new Blob([bytes], { type: 'audio/wav' }),", "blob: new Blob([bytes.slice().buffer as ArrayBuffer], { type: 'audio/wav' }),"],
            ["await db.putRecording(session.id, new Blob([bytes], {\n          type: 'application/octet-stream',\n        }));", "await db.putRecording(session.id, new Blob([bytes.slice().buffer as ArrayBuffer], {\n          type: 'application/octet-stream',\n        }));"]
          ];
          for (const [before, after] of pairs) {
            if (!source.includes(before)) throw new Error(`Backup patch target not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Set exact secure versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          Object.assign(pkg.devDependencies, {
            '@playwright/test': '^1.55.0',
            '@vitejs/plugin-react': '6.0.4',
            'autoprefixer': '10.5.4',
            'axe-core': '^4.10.3',
            'postcss': '8.5.25',
            'tailwindcss': '3.4.17',
            'typescript': '7.0.2',
            'vite': '8.2.0',
            'vite-plugin-pwa': '1.3.0',
            'vitest': '4.1.10'
          });
          Object.assign(pkg.scripts, {
            'test': 'vitest',
            'test:run': 'vitest run',
            'test:browser': 'playwright test',
            'audit:prod': 'npm audit --omit=dev --audit-level=high'
          });
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Rebuild dependency graph
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm audit fix

      - name: Validate migration
        run: |
          npm run lint
          npm run test:run
          npm run build
          npm run audit:prod

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-secure-toolchain-migration.yml

      - name: Commit validated migration
        run: |
          git config user.name "Poly Pro Hardening Bot"
          git config user.email "noreply@github.com"
          git add package.json package-lock.json src/utils/backup.ts .github/workflows/one-time-secure-toolchain-migration.yml
          git commit -m "Upgrade secure build and test toolchain [hardening-bot]"
          git push origin HEAD:agent/production-hardening
