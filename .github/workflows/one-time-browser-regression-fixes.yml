name: One-time Browser Regression Fixes

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply storage, backup, accessibility, and test fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patchFile(path, patches) {
            let source = fs.readFileSync(path, 'utf8');
            for (const [before, after, label] of patches) {
              if (!source.includes(before)) {
                throw new Error(`${path}: patch target not found: ${label}`);
              }
              source = source.replace(before, after);
            }
            fs.writeFileSync(path, source);
          }

          patchFile('src/store/db.ts', [
            [
              "import type { MetronomeSnapshot } from './persisted-shapes';",
              "import type { MetronomeSnapshot } from './persisted-shapes';\nimport { getManagedRecordingFileName, removeManagedRecordingFile } from '../platform/recordingSink';",
              'managed recording import',
            ],
            [
              `export async function putRecording(sessionId: string, blob: Blob): Promise<void> {\n  const database = await getDB();\n  await database.put('recordings', blob, sessionId);\n}`,
              `export async function putRecording(sessionId: string, blob: Blob): Promise<void> {\n  const database = await getDB();\n  const previous = await database.get('recordings', sessionId);\n  await database.put('recordings', blob, sessionId);\n\n  const previousFileName = previous instanceof Blob\n    ? getManagedRecordingFileName(previous)\n    : null;\n  const nextFileName = getManagedRecordingFileName(blob);\n  if (previousFileName && previousFileName !== nextFileName) {\n    await removeManagedRecordingFile(previousFileName);\n  }\n}`,
              'recording replacement cleanup',
            ],
            [
              `export async function deleteRecording(sessionId: string): Promise<void> {\n  const database = await getDB();\n  await database.delete('recordings', sessionId);\n}`,
              `export async function deleteRecording(sessionId: string): Promise<void> {\n  const database = await getDB();\n  const existing = await database.get('recordings', sessionId);\n  await database.delete('recordings', sessionId);\n\n  const fileName = existing instanceof Blob\n    ? getManagedRecordingFileName(existing)\n    : null;\n  if (fileName) await removeManagedRecordingFile(fileName);\n}`,
              'recording deletion cleanup',
            ],
          ]);

          patchFile('src/utils/backup.ts', [
            [
              `        // Give JSZip the Blob directly. This avoids eagerly materializing a\n        // second ArrayBuffer for every recording before compression begins.\n        recordingsFolder.file(\`${'${session.id}'}.pcm\`, blob, {\n          binary: true,\n          compression: 'DEFLATE',\n        });`,
              `        // JSZip's browser path does not reliably accept File objects backed\n        // by OPFS/IndexedDB. Convert one bounded recording at a time after the\n        // cumulative safety check instead of preloading every session first.\n        const bytes = await blob.arrayBuffer();\n        recordingsFolder.file(\`${'${session.id}'}.pcm\`, bytes, {\n          binary: true,\n          compression: 'DEFLATE',\n        });`,
              'JSZip recording input',
            ],
          ]);

          patchFile('src/components/settings/SoundSettings.tsx', [
            [
              `<Toggle\n            enabled={individualBeatSounds}\n            onChange={setIndividualBeatSounds}\n          />`,
              `<Toggle\n            label="Individual beat sounds"\n            enabled={individualBeatSounds}\n            onChange={setIndividualBeatSounds}\n          />`,
              'individual beat sound label',
            ],
            [
              `<Toggle enabled={soundActive} onChange={setSoundActive} />`,
              `<Toggle label="Sound active" enabled={soundActive} onChange={setSoundActive} />`,
              'sound active label',
            ],
            [
              `<Toggle enabled={soundActiveWhileRecording} onChange={setSoundActiveWhileRecording} />`,
              `<Toggle\n            label="Sound active while recording"\n            enabled={soundActiveWhileRecording}\n            onChange={setSoundActiveWhileRecording}\n          />`,
              'recording sound label',
            ],
            [
              `<Toggle enabled={sampleVolumePreview} onChange={setSampleVolumePreview} />`,
              `<Toggle\n            label="Sample volume preview"\n            enabled={sampleVolumePreview}\n            onChange={setSampleVolumePreview}\n          />`,
              'sample preview label',
            ],
            [
              `<input\n          type="range"\n          min="0"`,
              `<input\n          aria-label="Click volume"\n          type="range"\n          min="0"`,
              'click-volume input label',
            ],
          ]);

          patchFile('src/components/settings/VibrationSettings.tsx', [
            [
              `import { HelpTip } from '../ui/HelpTip';`,
              `import { HelpTip } from '../ui/HelpTip';\nimport { Toggle } from '../ui/Toggle';`,
              'Toggle import',
            ],
            [
              `        <button\n          onClick={() => setHapticEnabled(!hapticEnabled)}\n          className={\`\n            relative w-12 h-7 rounded-full transition-colors\n            \${hapticEnabled ? 'bg-[rgba(255,255,255,0.3)]' : 'bg-bg-raised'}\n          \`}\n        >\n          <div\n            className={\`\n              absolute top-0.5 w-6 h-6 rounded-full transition-all\n              \${hapticEnabled ? 'left-5.5 bg-white' : 'left-0.5 bg-text-muted'}\n            \`}\n          />\n        </button>`,
              `        <Toggle\n          label="Haptic feedback"\n          enabled={hapticEnabled}\n          onChange={setHapticEnabled}\n        />`,
              'haptic custom toggle',
            ],
            [
              `<input\n          type="range"\n          min="0"\n          max="100"\n          value={vibrationIntensity}`,
              `<input\n          aria-label="Vibration intensity"\n          type="range"\n          min="0"\n          max="100"\n          value={vibrationIntensity}`,
              'vibration intensity label',
            ],
            [
              `<input\n              type="range"\n              min="20"`,
              `<input\n              aria-label="Vibration test duration"\n              type="range"\n              min="20"`,
              'vibration duration label',
            ],
          ]);

          patchFile('src/components/settings/CloudSettings.tsx', [
            [
              `import { HelpTip } from '../ui/HelpTip';`,
              `import { HelpTip } from '../ui/HelpTip';\nimport { Toggle } from '../ui/Toggle';`,
              'cloud Toggle import',
            ],
            [
              `        <button\n          onClick={() => setEnabled(!enabled)}\n          className={\`\n            relative w-10 h-6 rounded-full transition-colors\n            \${enabled ? 'bg-accent' : 'bg-bg-raised'}\n          \`}\n        >\n          <div\n            className={\`\n              absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all\n              \${enabled ? 'left-[18px]' : 'left-0.5'}\n            \`}\n          />\n        </button>`,
              `        <Toggle\n          label="Enhanced cloud analysis"\n          enabled={enabled}\n          onChange={setEnabled}\n        />`,
              'cloud custom toggle',
            ],
          ]);

          patchFile('src/components/ui/PrecisionSlider.tsx', [
            [
              `<input\n                ref={inputRef}\n                type="number"`,
              `<input\n                ref={inputRef}\n                aria-label={\`Edit precision value${'${unit}' ? ` in ${'${unit}'}` : ''}\`}\n                type="number"`,
              'precision numeric input label',
            ],
            [
              `<button\n              onClick={() => {`,
              `<button\n              type="button"\n              aria-label={\`Edit precision value${'${unit}' ? ` in ${'${unit}'}` : ''}. Current value ${'${displayValue}'}\`}\n              onClick={() => {`,
              'precision value button label',
            ],
            [
              `        <div\n          ref={trackRef}\n          className="relative h-9 flex items-center cursor-pointer touch-none select-none"`,
              `        <div\n          ref={trackRef}\n          role="slider"\n          tabIndex={0}\n          aria-label={\`Adjust precision value${'${unit}' ? ` in ${'${unit}'}` : ''}\`}\n          aria-valuemin={min}\n          aria-valuemax={max}\n          aria-valuenow={value}\n          aria-valuetext={displayValue}\n          className="relative h-9 flex items-center cursor-pointer touch-none select-none\n                     focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"`,
              'precision slider semantics',
            ],
            [
              `          onPointerCancel={handlePointerUp}\n        >`,
              `          onPointerCancel={handlePointerUp}\n          onKeyDown={(event) => {\n            const keyboardStep = event.shiftKey ? fineStep : coarseStep;\n            if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {\n              event.preventDefault();\n              onChange(clamp(roundToStep(value - keyboardStep, fineStep), min, max));\n            } else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {\n              event.preventDefault();\n              onChange(clamp(roundToStep(value + keyboardStep, fineStep), min, max));\n            } else if (event.key === 'Home') {\n              event.preventDefault();\n              onChange(min);\n            } else if (event.key === 'End') {\n              event.preventDefault();\n              onChange(max);\n            }\n          }}\n        >`,
              'precision slider keyboard controls',
            ],
          ]);

          patchFile('tests/e2e/hardening.spec.ts', [
            [
              `  await expect(page.getByRole('alert')).toContainText(\n    'could not initialize raw audio capture',\n    { timeout: 35_000 },\n  );`,
              `  await expect(page.getByText(/could not initialize raw audio capture/i)).toBeVisible({\n    timeout: 35_000,\n  });`,
              'specific recording timeout assertion',
            ],
          ]);
          NODE

      - name: Validate regression fixes
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-browser-regression-fixes.yml

      - name: Commit validated fixes
        run: |
          git config user.name "Poly Pro Hardening Bot"
          git config user.email "noreply@github.com"
          git add src/store/db.ts src/utils/backup.ts src/components/settings/SoundSettings.tsx src/components/settings/VibrationSettings.tsx src/components/settings/CloudSettings.tsx src/components/ui/PrecisionSlider.tsx tests/e2e/hardening.spec.ts .github/workflows/one-time-browser-regression-fixes.yml
          git commit -m "Fix final browser regressions [hardening-bot]"
          git push origin HEAD:agent/production-hardening
