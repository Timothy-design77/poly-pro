name: Final Browser Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/full-functional-audit

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create evidence directory
        run: mkdir -p audit-artifacts-v4

      - name: Install application dependencies
        run: npm ci

      - name: Build production PWA
        run: npm run build

      - name: Install isolated browser dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate deterministic fake microphone input
        run: node tests/generate-fake-audio.mjs /tmp/poly-pro-fake-mic.wav | tee audit-artifacts-v4/fake-audio.json

      - name: Start production preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > audit-artifacts-v4/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/poly-pro/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat audit-artifacts-v4/preview.log
          exit 1

      - name: Run final targeted browser diagnostics
        shell: bash
        run: |
          set +e
          AUDIT_BASE_URL=http://127.0.0.1:4173/poly-pro/ \
          AUDIT_FAKE_AUDIO=/tmp/poly-pro-fake-mic.wav \
          AUDIT_OUTPUT_DIR=audit-artifacts-v4 \
          node tests/browser-audit-v4.mjs 2>&1 | tee audit-artifacts-v4/browser-audit-v4.log
          echo ${PIPESTATUS[0]} > audit-artifacts-v4/exit-code.txt
          exit 0

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poly-pro-final-browser-diagnostics-${{ github.sha }}
          path: audit-artifacts-v4
          if-no-files-found: error
          retention-days: 30

      - name: Fail on confirmed defects
        if: always()
        shell: bash
        run: exit "$(cat audit-artifacts-v4/exit-code.txt 2>/dev/null || echo 1)"
